[project]
name = "tradeforge-collector"
version = "0.1.0"
description = "MetaTrader 5 data collector (Windows-only): OHLCV backfill, live candles, instrument specs."
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
    "tradeforge-db",
    # Candle and InstrumentSpec are the engine's types. The collector fills them in;
    # it does not get to define what a candle is.
    "tradeforge-engine",
    "tradeforge-schema",
    "pyarrow>=18.1",
    # The same client the API already pulls in under `arq`, declared here because the live
    # loop publishes candles itself. A stream is the point: pub/sub, which this project uses
    # for job progress, drops what nobody was listening for — and a paper session that
    # restarts has to be able to resume from where it stopped.
    "redis>=5",
    # The same runner the API's worker uses, on a queue only this process drains. A job that
    # needs MetaTrader can only be executed on Windows (ADR-02), so the segregation is a
    # capability boundary rather than a priority one — see ADR-0021. Declared here rather than
    # borrowed from the API: nothing in `apps/collector` imports `tradeforge_api`, and a
    # dependency that works only because a sibling app happens to pull it in is a dependency
    # that breaks the first time the sibling drops it.
    "arq>=0.26",
    # The official MT5 library ships Windows wheels only. The environment marker is
    # what turns ADR-02 (isolate the broker dependency) into a build-time fact:
    # Linux CI simply cannot resolve this package outside collector/executor.
    "MetaTrader5>=5.0.45; sys_platform == 'win32'",
]

[project.scripts]
tradeforge-collector = "tradeforge_collector.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tradeforge_collector"]
