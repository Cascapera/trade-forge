# nginx serves the built SPA and proxies the API, so the browser talks to one origin (no CORS).
# This mirrors the vite dev proxy: /api is stripped before reaching the backend, and any unknown
# path falls back to index.html so the client-side router owns navigation.

# `Connection: upgrade` only when the client actually asked for one; otherwise `close`.
# A location that sent `upgrade` unconditionally would attach an upgrade header to every ordinary
# API call, which some proxies in front of it will reject outright.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The API, same-origin under /api. The trailing slash on proxy_pass strips the /api prefix, so
    # the browser's /api/strategies reaches the backend's /strategies — the vite rewrite, in nginx.
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The live-session feed is a WebSocket, and an upgrade needs all three of these. Without
        # them nginx answers the handshake as an ordinary request: the browser sees a socket that
        # closed immediately and no log anywhere says why. HTTP/1.1 because HTTP/1.0 has no
        # upgrade mechanism at all, and `$connection_upgrade` rather than a literal so an ordinary
        # request through this same location is not told to upgrade.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # ⚠️ A socket that says nothing is not an idle socket. A healthy live session is silent
        # between bars — on H1 that is an hour — and nginx's default read timeout is 60 seconds,
        # so the default would drop the feed roughly every minute on a session behaving perfectly.
        proxy_read_timeout 1h;
    }

    # The SPA: a deep link like /results/<id> is not a file on disk, so serve the app shell and let
    # the router resolve it. Real assets (hashed JS/CSS) still resolve by $uri first.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
