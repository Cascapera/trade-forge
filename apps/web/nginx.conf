# nginx serves the built SPA and proxies the API, so the browser talks to one origin (no CORS).
# This mirrors the vite dev proxy: /api is stripped before reaching the backend, and any unknown
# path falls back to index.html so the client-side router owns navigation.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The API, same-origin under /api. The trailing slash on proxy_pass strips the /api prefix, so
    # the browser's /api/strategies reaches the backend's /strategies — the vite rewrite, in nginx.
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The SPA: a deep link like /results/<id> is not a file on disk, so serve the app shell and let
    # the router resolve it. Real assets (hashed JS/CSS) still resolve by $uri first.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
