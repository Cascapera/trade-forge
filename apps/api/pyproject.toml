[project]
name = "tradeforge-api"
version = "0.1.0"
description = "FastAPI backend: strategies, backtests, live sessions. Portable (Linux/Docker)."
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
    "tradeforge-db",
    "tradeforge-engine",
    "tradeforge-schema",
    # The collector owns the Parquet reader (`read_candles`); the worker reuses it rather
    # than duplicating pyarrow. Safe on Linux: the collector imports `MetaTrader5` lazily,
    # only inside `connect()`, so depending on the package never pulls the Windows-only wheel.
    "tradeforge-collector",
    # The executor owns the order/fill wire format (`tradeforge_executor.wire`), and a live
    # session's `MT5Broker` produces one half of it and consumes the other. The format lives
    # with the executor and is imported here rather than copied for the same reason the candle
    # format lives with the collector: two copies agree on the day they are written and
    # disagree on the day one of them changes, and the disagreement arrives as an order sent at
    # the wrong size, not as an error.
    #
    # Safe on Linux for the same reason the collector is — `MetaTrader5` is guarded by
    # `sys_platform == 'win32'` there and imported only inside `MT5Gateway.connect()`, so
    # nothing at this package's import time reaches for a Windows wheel. Declared rather than
    # borrowed from the workspace: a dependency that resolves only because everything happens
    # to be installed together is a dependency that breaks the first time it is not.
    "tradeforge-executor",
    "fastapi>=0.115",
    # `[standard]` brings the websockets and httptools that the WS endpoint and a production
    # server need; without it uvicorn runs but cannot speak WebSocket.
    "uvicorn[standard]>=0.51.0",
    # The async job queue (spec: arq). Redis is the broker; arq is the runner.
    "arq>=0.26",
    "pydantic-settings>=2.7",
    "psycopg[binary]>=3.3.4",
    "redis>=5.2",
]

[project.scripts]
tradeforge-health = "tradeforge_api.cli:main"
tradeforge-session = "tradeforge_api.live.process:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tradeforge_api"]
